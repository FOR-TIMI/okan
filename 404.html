<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <script>
      // GitHub Pages SPA redirect trick.
      // On a 404, preserve the full path/query/hash in sessionStorage,
      // then redirect to the root so index.html loads. The main app
      // reads sessionStorage on boot and restores the URL via history.replaceState.
      var l = window.location;
      sessionStorage.redirect = l.pathname + l.search + l.hash;
      l.replace(l.protocol + '//' + l.host + '/');
    </script>
  </head>
  <body></body>
</html>
